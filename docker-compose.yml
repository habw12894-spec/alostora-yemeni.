services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: avnex
      POSTGRES_USER: avnex_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - avnex_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avnex_user -d avnex"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://avnex_user:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/avnex
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MAX_VIDEO_MB: 100
      UPLOAD_DIR: uploads
    ports:
      - "3000:3000"
    volumes:
      - avnex_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  avnex_pgdata:
  avnex_uploads:
